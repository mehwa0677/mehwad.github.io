<body>

  <!-- ============ NAV (메인 페이지와 동일) ============ -->
  <header class="header">
    <nav class="nav container">
      <a href="index.html" class="logo" aria-label="RESCENE 홈">
        <img class="logo-img" src="images/logo.png" alt="RESCENE">
        <span class="logo-text en">RESCENE</span>
      </a>

      <button class="menu-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="menu">
        <span></span><span></span>
      </button>

      <div class="menu" id="menu">
        <a class="navlink" href="index.html#story">WHO</a>
        <a class="navlink" href="index.html#collection">SCENTS</a>

      </div>
    </nav>
  </header>

  <!-- ============ MEMBER DETAIL ============ -->
  <!-- 내용은 js/members.js 에서 수정하세요 -->
  <main class="member-page container">
    <a href="index.html#collection" class="back-link fade">← 멤버 전체 보기</a>

    <section class="member-detail">
      <div class="ph hero-img member-photo" id="memberPhotoBox" data-label="Member · 4:5">
        <img class="ph-media" id="memberPhoto" src="" alt="">
      </div>

      <div class="member-info">
        <p class="eyebrow fade" id="memberCount">MEMBER</p>
        <h1 class="member-name en">
          <span class="line"><span id="memberName"></span></span>
        </h1>
        <p class="member-line kr fade" id="memberLine"></p>
        <span class="rule fade"></span>

        <!-- 프로필 표 — 내용은 js/members.js 에서 수정 -->
        <table class="profile-table fade-2">
          <caption class="sr-only">멤버 프로필</caption>
          <tbody>
            <tr><th scope="row">본명</th><td id="pRealName"></td></tr>
            <tr><th scope="row">출생</th><td id="pBirth"></td></tr>
            <tr><th scope="row">MBTI</th><td id="pMbti"></td></tr>
            <tr><th scope="row">소개</th><td id="pIntro"></td></tr>
            <tr><th scope="row">유행어</th><td id="pCatchphrase"></td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- 이전 · 다음 멤버 -->
    <nav class="member-nav" aria-label="다른 멤버 보기">
      <a href="#" id="prevMember" class="member-nav-link">
        <span class="member-nav-label">← PREV</span>
        <span class="member-nav-name en" id="prevName"></span>
      </a>
      <a href="#" id="nextMember" class="member-nav-link is-next">
        <span class="member-nav-label">NEXT →</span>
        <span class="member-nav-name en" id="nextName"></span>
      </a>
    </nav>
